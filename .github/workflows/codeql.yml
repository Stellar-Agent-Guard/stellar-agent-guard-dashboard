name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:47 UTC — offset from security.yml so the two scheduled
    # analyses do not start together.
    - cron: "47 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the analysis results to code scanning.
      security-events: write
      # Required to fetch CodeQL query packs from the container registry.
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # javascript-typescript is interpreted, so no autobuild step and no build
      # artifacts are needed: the extractor reads the source directly.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
