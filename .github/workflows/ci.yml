name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: this workflow only needs to read the repository to
# check it out, so `contents: read` is the whole grant. Anything broader would
# hand an unnecessary capability to third-party action code running in the job.
permissions:
  contents: read

# A new push to the same pull request makes the running job obsolete, so cancel
# it rather than spending a runner on a commit nobody will merge. Pushes to main
# are never cancelled: each one is a merge that may need its result recorded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Generous but finite: a hung install or a Playwright download that never
    # finishes must fail the check instead of holding a runner for six hours.
    timeout-minutes: 30
    steps:
      # Every `uses:` is pinned to a full 40-char commit SHA with a readable
      # version comment. A moving tag (e.g. `@v4`) can be repointed upstream at
      # any time, which would let changed third-party code execute here with no
      # reviewable diff in this repository. Dependabot (.github/dependabot.yml)
      # keeps these pins current through reviewable PRs.
      #
      # `persist-credentials: false` keeps the job's token out of .git/config:
      # nothing here pushes, and a later step that runs project code should not
      # be able to read a credential it has no use for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 comes from package.json `engines` (">=24.0.0"); the repository
      # has no .nvmrc. Keep this in step with engines when the floor moves.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # `npm ci` installs exactly the committed lockfile and fails if it and
      # package.json disagree, so CI can never test a dependency tree that no
      # reviewer saw. `--ignore-scripts` blocks arbitrary install-time code from
      # every dependency (and the vendored SDK tarball); both esbuild and
      # unrs-resolver ship prebuilt platform packages, so nothing here needs a
      # lifecycle script to work. `.npmrc` sets the same flag for local runs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit and property-based tests only. The integration proof
      # (scripts/prove-phase3.ts) spends real testnet funds and needs funded
      # testnet keys, so it is run deliberately and is not part of this gate.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The zero-server boundary is an architectural decision, not a style rule:
      # a Next.js route handler or a middleware file would be the first place a
      # proxy, a signer, or a secret could appear. The script names any offending
      # path and links the ADR, so this fails before review has to notice it.
      - name: No-server boundary
        run: npm run check:no-server

      # Formatting is a separate gate from linting: eslint-config-next carries
      # no stylistic rules, so prettier is the only thing that can catch
      # whitespace/line-ending drift.
      - name: Format
        run: npm run format:check

      # Every relative path and section anchor in the README, SPEC.md,
      # CONTRIBUTING.md and docs/ is a promise that the docs still line up.
      # This checks it offline, so a broken external link cannot fail a build.
      - name: Documentation links
        run: npm run test:docs

      - name: Docs-referenced npm scripts exist
        run: npm run check:docs-scripts

      # The scope statement is a hard requirement of this project, not a
      # documentation nicety: fail if code, README and SPEC.md drift apart on
      # what is and is not enforced.
      - name: Enforcement-scope statement is consistent
        run: node --test tests/unit/scopeStatement.test.ts

      # Browser end-to-end suites (issues #112/#113): the operator lifecycle
      # and the telemetry filter/export paths, driven through the real pages in
      # headless Chromium against an in-process mock chain — no testnet, no
      # network. These live inside the required `ci` job rather than beside it
      # so branch protection (which requires the check named `ci`) gates on them.
      #
      # The perf benchmark (tests/perf, #114) is deliberately absent:
      # frame-rate assertions depend on the runner's GPU/CPU, so it runs
      # locally via `npm run test:perf`.
      #
      # The key hashes the *installed* `@playwright/test` package, not the whole
      # lockfile: a hit across a Playwright bump would run a binary the pinned
      # version does not expect. No `restore-keys` for the same reason.
      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json') }}

      # Unconditional, cache hit or not: on a hit it is a short no-op that also
      # proves the restored tree is the one this runner can execute.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Traces and the HTML report are the first thing a maintainer needs when
      # CI goes red; the config keeps traces only on failure.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
