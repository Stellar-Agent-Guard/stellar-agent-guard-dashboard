name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # The Phase 2 SDK is vendored as a tarball until it is published to npm, so
      # this also verifies that the committed tarball is installable and usable.
      # When Phase 2 publishes, this step's premise disappears with it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit tests only. The integration proof (scripts/prove-phase3.ts) spends
      # real testnet funds and needs funded testnet keys, so it is run
      # deliberately and is not part of the CI gate.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The scope statement is a hard requirement of this project, not a
      # documentation nicety: fail the build if the code, README and SPEC.md
      # have drifted apart on what is and is not enforced.
      - name: Enforcement-scope statement is consistent
        run: node --test tests/unit/scopeStatement.test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e tests
        run: npx playwright test tests/e2e/smoke.spec.ts --reporter=line

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Update or verify visual baseline
        run: npx playwright test tests/e2e/visual.spec.ts --reporter=line

      - name: Upload visual artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
